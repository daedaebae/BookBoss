name: Backend Test

on:
  workflow_call:

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'ci_root_pw' }}
          MYSQL_DATABASE: bookboss
          MYSQL_USER: test_user
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || 'ci_app_pw' }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Validate required secrets
        env:
          CI_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          CI_MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
          CI_MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
        run: |
          [[ -z "$CI_JWT_SECRET" ]]          && echo "::warning::CI_JWT_SECRET not set — using fallback (tests only)"
          [[ -z "$CI_MYSQL_PASSWORD" ]]      && echo "::warning::CI_MYSQL_PASSWORD not set — using fallback (tests only)"
          [[ -z "$CI_MYSQL_ROOT_PASSWORD" ]] && echo "::warning::CI_MYSQL_ROOT_PASSWORD not set — using fallback (tests only)"
          true

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: cd server && npm ci

      - name: Build backend
        run: cd server && ./node_modules/.bin/tsc -p tsconfig.json

      - name: Initialize database
        env:
          DB_HOST: 127.0.0.1
          MYSQL_USER: test_user
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || 'ci_app_pw' }}
          MYSQL_DATABASE: bookboss
        run: cd server && node dist/src/config/migrate.js

      - name: Start server and run tests
        env:
          DB_HOST: 127.0.0.1
          MYSQL_USER: test_user
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || 'ci_app_pw' }}
          MYSQL_DATABASE: bookboss
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-jwt-secret-for-testing-only-32ch' }}
          PORT: 5000
        run: |
          cd server
          node dist/server.js > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "Server started with PID $SERVER_PID"
          sleep 5
          echo "=== Server log after 5s ==="
          cat /tmp/server.log || true
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "ERROR: Server process has already exited!"
            exit 1
          fi
          echo "Server process still running, waiting for health endpoint..."
          npx wait-on http://127.0.0.1:5000/api/health --timeout 30000
          npm test
