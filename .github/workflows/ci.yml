name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    uses: ./.github/workflows/backend-test.yml
    secrets: inherit

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./book-boss-react
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: book-boss-react/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Linter
        run: npm run lint

      - name: Build & Type Check
        run: npm run build
