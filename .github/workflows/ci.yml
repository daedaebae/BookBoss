name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: bookboss
          MYSQL_USER: test_user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
        
    - name: Install dependencies
      run: npm ci

    - name: Build Backend
      run: npm run build

    - name: Initialize Database
      env:
        DB_HOST: 127.0.0.1
        MYSQL_USER: test_user
        MYSQL_PASSWORD: password
        MYSQL_DATABASE: bookboss
      run: |
        node dist/src/config/migrate.js

    - name: Start Backend & Run Tests
      env:
        DB_HOST: 127.0.0.1
        MYSQL_USER: test_user
        MYSQL_PASSWORD: password
        MYSQL_DATABASE: bookboss
        JWT_SECRET: test_secret_key
        PORT: 5000
      run: |
        npm start &
        sleep 10
        npm test

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./book-boss-react
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: book-boss-react/package-lock.json
        
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
      
    - name: Run Linter
      run: npm run lint
      
    - name: Build & Type Check
      run: npm run build

  backend-syntax-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
    - name: Syntax Check
      run: npx tsc --noEmit
