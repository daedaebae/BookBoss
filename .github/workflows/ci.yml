name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: bookboss
          MYSQL_USER: test_user
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Install dependencies
      run: |
        cd server
        npm ci

    - name: Build Backend
      run: |
        (cd server && ./node_modules/.bin/tsc -p tsconfig.json)

    - name: Initialize Database
      env:
        DB_HOST: 127.0.0.1
        MYSQL_USER: test_user
        MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
        MYSQL_DATABASE: bookboss
      run: |
        cd server
        node dist/src/config/migrate.js

    - name: Start Backend & Run Tests
      env:
        DB_HOST: 127.0.0.1
        MYSQL_USER: test_user
        MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
        MYSQL_DATABASE: bookboss
        JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
        PORT: 5000
      run: |
        cd server
        npm start &
        sleep 10
        npm test

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./book-boss-react
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: book-boss-react/package-lock.json

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Run Linter
      run: npm run lint

    - name: Build & Type Check
      run: npm run build

  backend-syntax-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
    - name: Install dependencies
      run: |
        cd server
        npm ci
    - name: Syntax Check
      run: |
        (cd server && ./node_modules/.bin/tsc -p tsconfig.json)
