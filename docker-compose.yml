services:
  bookboss:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookboss
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database Configuration (Used by entrypoint.sh to configure MariaDB)
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      
      # Application Configuration (Used by Node.js Backend)
      - DB_HOST=127.0.0.1
      - DB_PORT=3306
      - JWT_SECRET=${JWT_SECRET}
      - NTFY_TOPIC=${NTFY_TOPIC}
      - NTFY_SERVER_URL=${NTFY_SERVER_URL}
      - PORT=3000
    volumes:
      # Persist the MariaDB database files
      - mysql_data:/var/lib/mysql
      # Persist user uploads (covers, etc)
      - ./server/uploads:/app/uploads
      # Persist backups
      - ./backups:/app/backups

volumes:
  mysql_data:
