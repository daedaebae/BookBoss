services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: bookboss-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bookboss
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./server/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: bookboss-backend
    restart: always
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: bookboss
      JWT_SECRET: ${JWT_SECRET}
      NTFY_TOPIC: ${NTFY_TOPIC}
      NTFY_SERVER_URL: ${NTFY_SERVER_URL}
      PORT: 3000
      DB_PORT: 3306
    depends_on:
      - db
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./server/uploads:/app/uploads
    command: npm run dev
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Frontend Web Service (Nginx)
  web:
    build:
      context: ./book-boss-react
      dockerfile: Dockerfile
      target: build
    image: node:18-alpine
    container_name: bookboss-web
    restart: always
    working_dir: /app
    ports:
      - "80:5173" # Map port 80 to Vite's 5173
      - "5173:5173"
    volumes:
      - ./book-boss-react:/app
      - /app/node_modules
    environment:
      - VITE_API_TARGET=http://backend:3000
    command: npm run dev
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  # Backup Service (Sidecar)
  backup:
    image: alpine:latest
    container_name: bookboss-backup
    restart: always
    depends_on:
      - db
    volumes:
      - ./backups:/backups
    environment:
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: bookboss
    command: >
      sh -c "apk add --no-cache mysql-client && echo 'Starting Backup Service...'; while true; do
        echo 'Starting backup at $$(date)...';
        mysqldump -h db -u $${MYSQL_USER} -p$${MYSQL_PASSWORD} bookboss > /backups/backup_$$(date +%Y-%m-%d_%H%M%S).sql 2>/dev/null;
        if [ $$? -eq 0 ]; then
             echo 'Backup successful';
             find /backups -name 'backup_*.sql' -mtime +7 -delete;
        else
             echo 'Backup failed';
        fi;
        echo 'Sleeping for 24h...';
        sleep 86400;
      done"
