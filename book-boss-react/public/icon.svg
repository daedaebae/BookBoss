<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f10b8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)" />
  <!-- Book spines (library icon) using gradient fill -->
  <rect x="5"  y="7" width="3" height="18" rx="1" fill="url(#grad)" opacity="1"/>
  <rect x="10" y="10" width="3" height="15" rx="1" fill="url(#grad)" opacity="0.9"/>
  <rect x="15" y="8"  width="4" height="17" rx="1" fill="url(#grad)" opacity="1"/>
  <rect x="21" y="6"  width="3" height="19" rx="1" fill="url(#grad)" opacity="0.85"/>
  <!-- Base line -->
  <rect x="4" y="26" width="24" height="2" rx="1" fill="white" opacity="0.7"/>
</svg>
